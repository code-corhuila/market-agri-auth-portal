server {
    listen 80;
    root /usr/share/nginx/html;

    # remoteEntry and the federation manifest are never cached: they decide which version of
    # this portal the browser loads (Annex H, rule 4). The container, on another origin until the
    # gateway serves the portals, reads them cross-origin: they carry the CORS header.
    location ~* (remoteEntry\.js|mf-manifest\.json)$ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    # The chunks of ./App, imported by the container cross-origin too.
    location /assets/ {
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # A portal is not a page of its own: nothing else is served.
    location / {
        try_files $uri =404;
    }
}
