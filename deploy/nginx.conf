server {
    listen 80;
    root /usr/share/nginx/html;

    # The gateway serves this portal under /portals/<name>/ and strips the prefix (ADR-017): the
    # browser and the container are on the same origin, so no CORS is needed.

    # remoteEntry and the federation manifest are never cached: they decide which version of
    # this portal the browser loads (Annex H, rule 4).
    location ~* (remoteEntry\.js|mf-manifest\.json)$ {
        add_header Cache-Control "no-store";
    }

    # A portal is not a page of its own: only its files are served.
    location / {
        try_files $uri =404;
    }
}
